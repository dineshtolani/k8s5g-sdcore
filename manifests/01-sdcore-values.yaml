# ------------------------------------------------------------------
# sdcore-values.yaml
#
# Reference values file for the SD-Core Helm chart (sd-core 5.0.0).
# This is NOT the file passed by OnRamp. It documents the key fields
# that differ between a default OnRamp install and this lab.
#
# The authoritative file generated by OnRamp lives at:
#   /tmp/sdcore-5g-values.yaml
#   (on the target host after `make aether-5gc-install` starts)
# ------------------------------------------------------------------

# -- UPF datapath configuration
# AF_PACKET is used because DPDK and AF_XDP are blocked on this
# hardware (see docs/03-decisions.md). AF_PACKET requires no IOMMU,
# no SR-IOV, and no hugepages for the datapath itself.
omec-user-plane:
  config:
    upf:
      mode: af_packet          # options: af_packet | dpdk | cndp | af_xdp
      hwcksum: false            # must be false in virtualized environments
      gtppsc: true
      measure_upf: false
      enable_ue_ip_alloc: true
      ue_ip_pool: "172.250.0.0/16"
      dnn: internet
      hostname: upf             # NOTE: resolved via cluster DNS
                                #      will FAIL if no DNS record exists
                                #      see docs/04-troubleshooting.md #8

# -- Node selection
# The UPF pod has a hard nodeSelector. On a single-node kubeadm
# cluster this label must be applied manually before install:
#   kubectl label node <name> node-role.aetherproject.org/upf=true
upf:
  nodeSelector:
    node-role.aetherproject.org/upf: "true"

# -- Resource requests (documented, not overriding chart defaults)
# Actual values are in the Helm chart defaults. The UPF requests
# 2Gi hugepages-1Gi in AF_PACKET mode. If hugepages are not present
# on the node, the pod stays Pending with:
#   "0/1 nodes are available: 1 Insufficient hugepages-1Gi"
resources:
  upf:
    requests:
      cpu: "2"
      memory: "4Gi"
      hugepages-1Gi: "2Gi"
    limits:
      cpu: "4"
      memory: "4Gi"
      hugepages-1Gi: "2Gi"